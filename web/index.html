<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EvernightRealm - a self-hosted, offline-first LAN platform for immersive activities, characters and virtual assets.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EvernightRealm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon：ico 供舊瀏覽器與書籤列使用，png 供現代瀏覽器使用 -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EvernightRealm</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 啟動畫面：品牌底色 + 置中圖示；圖示直接重用 PWA 的 512 圖示，
       不另外為啟動畫面存一份衍生 PNG。Flutter 畫出第一帧後由下方腳本移除。 */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2c2740;
      z-index: 9999;
      transition: opacity 240ms ease-out;
    }
    #splash > img {
      width: 160px;
      height: 160px;
    }
    #splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      #splash {
        transition: none;
      }
    }
  </style>
  <script>
    // 品牌顯示名依瀏覽器首選語言切換（四語言對照見規格 §1.1；引入零依賴）。
    // <title> 與 manifest 連結此處先寫英文值，是為了讓停用指令碼的環境仍拿到
    // 英文名；Flutter 側的 MaterialApp.title 刻意不設（DEC-026），故不會被覆寫。
    // PWA 的 manifest 沒有「單档多語言」機制，因此另備三份在地化 manifest 依語言指路。
    (function () {
      var tag = String(
        navigator.languages && navigator.languages.length
          ? navigator.languages[0]
          : navigator.language || 'en'
      ).toLowerCase();
      var name = 'EvernightRealm';
      var manifest = 'manifest.json';
      if (tag.indexOf('ja') === 0) {
        name = '長夜幻境';
        manifest = 'manifest.ja.json';
      } else if (tag.indexOf('zh') === 0) {
        if (/hant|tw|hk|mo/.test(tag)) {
          name = '長夜幻境';
          manifest = 'manifest.zh-TW.json';
        } else {
          name = '长夜幻境';
          manifest = 'manifest.zh-CN.json';
        }
      }
      document.title = name;
      var appleTitle = document.querySelector(
        'meta[name="apple-mobile-web-app-title"]'
      );
      if (appleTitle) {
        appleTitle.setAttribute('content', name);
      }
      var manifestLink = document.querySelector('link[rel="manifest"]');
      if (manifestLink) {
        manifestLink.setAttribute('href', manifest);
      }
    })();
  </script>
</head>
<body>
  <div id="splash" role="presentation">
    <img src="icons/Icon-512.png" alt="" width="160" height="160">
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 引擎畫出第一帧時會在 window 上派送 flutter-first-frame。
    // 若引擎因故沒派送（例如載入失敗），留著啟動畫面仍比白畫面好，故不設逾時強制移除。
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('is-hidden');
      setTimeout(function () {
        splash.remove();
      }, 300);
    });
  </script>
</body>
</html>
